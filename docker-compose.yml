services:
  backend:
    image: golang:1.24
    container_name: ujin_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    command: tail -f /dev/null
    ports:
      - "${PORT}:8080"
    depends_on:
      - postgres

  frontend:
    image: node:22
    container_name: ujin_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    env_file:
      - .env
    command: tail -f /dev/null
    ports:
      - "${FRONTEND_PORT}:3000"

  postgres:
    image: postgres:17
    container_name: ujin_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
