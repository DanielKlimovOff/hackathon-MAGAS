services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ujin_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

  postgres:
    image: postgres:17
    container_name: ujin_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    container_name: ujin_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  backend:
    image: golang:1.26.2
    container_name: ujin_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    command: go run ./cmd/api/main.go
    ports:
      - "${PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22
    container_name: ujin_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    env_file:
      - .env
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT}:5173"

  migrate:
    image: migrate/migrate
    restart: "no"
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "${DATABASE_MIGRATE_URL}",
        "up"
      ]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
